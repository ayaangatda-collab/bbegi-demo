<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빼기 시연 · 고객용 / 공단용</title>
<meta name="description" content="점포 정리 신청 흐름(고객용)과 정산 확인(공단용)을 한 링크에서 전환하며 체험하는 시연">
<link rel="icon" href="assets/favicon.svg">
<style>html,body{margin:0;height:100%;background:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;display:grid;place-items:center;color:#1a2035}main{text-align:center;padding:24px}a{color:#293dff;font-weight:700}</style>
</head>
<body>
<main>
 <p>시연 화면으로 이동합니다…</p>
 <p><a id="manual" href="./index.html#/hope-flow-home">바로 열기</a></p>
</main>
<script>
 (function(){
  var lang=new URLSearchParams(location.search).get('lang')||'ko';
  var tab=new URLSearchParams(location.search).get('tab');
  var hash=tab==='agency'?'#/agency':'#/hope-flow-home';
  var target='./index.html?lang='+encodeURIComponent(lang)+hash;
  location.replace(target);
  document.getElementById('manual').href=target;
 })();
</script>
</body>
</html>
